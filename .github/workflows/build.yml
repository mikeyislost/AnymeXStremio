name: Build & Release

# Every push to main builds iOS + Windows and publishes ONE GitHub release
# (vX.Y.Z) containing the IPA, the Windows installer + portable zip, the
# Feather source file and a changelog of what changed since the last release.
#
# Pushes to `beta` build "AnymeX+ β" instead: a GitHub pre-release tagged
# like AnymeX's betas (v1.1.2-beta, then v1.1.2+1-beta, ...), with its own
# app ID, icon and data so it installs next to the stable app, and its own
# Feather source (feather branch). Shipping a beta = merging beta into main
# (the "Ship beta as release" workflow does that), which builds vX.Y.Z.
on:
  push:
    branches: [main, beta]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.41.6"

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast (Linux) check so mistakes fail in ~5 minutes, plus the version.
  analyze:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      build: ${{ steps.ver.outputs.build }}
      channel: ${{ steps.ver.outputs.channel }}
      tag: ${{ steps.ver.outputs.tag }}
      file_ver: ${{ steps.ver.outputs.file_ver }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Version: vX.Y.Z with single digits that roll over (1.0.9 -> 1.1.0,
      # 1.9.9 -> 2.0.0). Next = latest stable release + 1; an old tag like
      # 1.0.10 counts as 1.1.0. Setting a higher version in pubspec.yaml
      # (e.g. 2.0.0) starts there instead. Betas are rounds of the next
      # stable version: v1.1.2-beta, v1.1.2+1-beta, v1.1.2+2-beta ...
      # Re-running a commit that already has a release reuses its version.
      - name: Compute version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CHANNEL=stable
          if [ "$GITHUB_REF_NAME" = "beta" ]; then CHANNEL=beta; fi
          if [ "$CHANNEL" = beta ]; then
            EXISTING=$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+(\+[0-9]+)?-beta$' | sort -V | tail -n 1 || true)
          else
            EXISTING=$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
          fi
          if [ -n "$EXISTING" ]; then
            TAG="${EXISTING#v}"
            VERSION=$(echo "$TAG" | sed -E 's/^([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          else
            RELEASES=$(gh api "repos/${{ github.repository }}/releases?per_page=100" -q '.[].tag_name' || true)
            BASE=$(grep '^version:' pubspec.yaml | sed -E 's/version: *([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
            LAST=$(echo "$RELEASES" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//' | sort -V | tail -n 1 || true)
            VERSION=$(python3 scripts/next_version.py "$BASE" "$LAST")
            if [ "$CHANNEL" = beta ]; then
              TAG=$( { echo "$RELEASES"; git tag; } | python3 scripts/next_beta.py "$VERSION")
            else
              TAG="$VERSION"
            fi
          fi
          # File names avoid "+": 1.1.2+1-beta -> 1.1.2-beta.1
          if [[ "$TAG" == *+* ]]; then
            ROUND="${TAG#*+}"; FILE_VER="$VERSION-beta.${ROUND%-beta}"
          else
            FILE_VER="$TAG"
          fi
          COUNT=$(git rev-list --count HEAD)
          {
            echo "version=$VERSION"
            echo "build=$COUNT"
            echo "channel=$CHANNEL"
            echo "tag=$TAG"
            echo "file_ver=$FILE_VER"
          } >> "$GITHUB_OUTPUT"
          echo "Channel: $CHANNEL · tag v$TAG · version $VERSION (build $COUNT) · files $FILE_VER"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Create placeholder .env
        run: touch .env

      - name: Install packages
        run: flutter pub get

      # The whole project is checked; errors fail the build (warnings and
      # style hints don't).
      - name: Analyze (errors fail the build)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # Unit tests for AnymeX+ logic (episode labels, ids, versions,
      # rotation). A failing test stops the release.
      - name: Unit tests
        run: |
          python3 scripts/test_versions.py
          flutter test

  ios:
    needs: analyze
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.analyze.outputs.version }}
      BUILD: ${{ needs.analyze.outputs.build }}
      RELEASE_CHANNEL: ${{ needs.analyze.outputs.channel }}
      TAG: ${{ needs.analyze.outputs.tag }}
      FILE_VER: ${{ needs.analyze.outputs.file_ver }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-apple-ios

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Optional repo secrets (Settings → Secrets and variables → Actions).
      - name: Setup environment
        shell: bash
        env:
          AL_CLIENT_ID: ${{ secrets.AL_CLIENT_ID }}
          AL_CLIENT_SECRET: ${{ secrets.AL_CLIENT_SECRET }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          SIMKL_CLIENT_SECRET: ${{ secrets.SIMKL_CLIENT_SECRET }}
          MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID }}
          MAL_CLIENT_SECRET: ${{ secrets.MAL_CLIENT_SECRET }}
          CALLBACK_SCHEME: ${{ secrets.CALLBACK_SCHEME }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          COMMENTS_BASE_URL: ${{ secrets.COMMENTS_BASE_URL }}
        run: |
          cat > .env << EOF
          AL_CLIENT_ID=$AL_CLIENT_ID
          AL_CLIENT_SECRET=$AL_CLIENT_SECRET
          SIMKL_CLIENT_ID=$SIMKL_CLIENT_ID
          SIMKL_CLIENT_SECRET=$SIMKL_CLIENT_SECRET
          MAL_CLIENT_ID=$MAL_CLIENT_ID
          MAL_CLIENT_SECRET=$MAL_CLIENT_SECRET
          CALLBACK_SCHEME=${CALLBACK_SCHEME:-anymex://callback}
          TMDB_API_KEY=$TMDB_API_KEY
          COMMENTS_BASE_URL=${COMMENTS_BASE_URL:-http://anymex.duckdns.org:8000/functions/v1}
          APP_CHANNEL=$RELEASE_CHANNEL
          APP_VERSION_TAG=$TAG
          EOF

      - name: Make the beta app (AnymeX+ β)
        if: env.RELEASE_CHANNEL == 'beta'
        run: python3 scripts/beta_build.py ios

      - name: Build iOS (unsigned)
        run: |
          flutter pub get
          flutter build ios --release --no-codesign \
            --build-name "$VERSION" --build-number "$BUILD"
          mkdir -p build/ios/iphoneos/Payload dist
          cp -R build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          (cd build/ios/iphoneos && zip -qr "../../../dist/AnymeX-Stremio-v$FILE_VER.ipa" Payload)

      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: dist/*.ipa

  windows:
    needs: analyze
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.analyze.outputs.version }}
      BUILD: ${{ needs.analyze.outputs.build }}
      RELEASE_CHANNEL: ${{ needs.analyze.outputs.channel }}
      TAG: ${{ needs.analyze.outputs.tag }}
      FILE_VER: ${{ needs.analyze.outputs.file_ver }}
    steps:
      - name: Enable Git long paths
        run: |
          git config --global core.longpaths true
          git config --system core.longpaths true

      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $innoPath = "${env:ProgramFiles(x86)}\Inno Setup 6"
          $isccPath = Join-Path $innoPath "ISCC.exe"
          if (-not (Test-Path $isccPath)) {
            $installer = "$env:TEMP\innosetup.exe"
            Invoke-WebRequest -Uri "https://jrsoftware.org/download.php/is.exe" -OutFile $installer -UseBasicParsing
            Start-Process -FilePath $installer -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-" -Wait -NoNewWindow
            Start-Sleep -Seconds 5
          }
          if (-not (Test-Path $isccPath)) { Write-Error "Inno Setup install failed"; exit 1 }
          echo "$innoPath" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Setup environment + version
        shell: bash
        env:
          AL_CLIENT_ID: ${{ secrets.AL_CLIENT_ID }}
          AL_CLIENT_SECRET: ${{ secrets.AL_CLIENT_SECRET }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          SIMKL_CLIENT_SECRET: ${{ secrets.SIMKL_CLIENT_SECRET }}
          MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID }}
          MAL_CLIENT_SECRET: ${{ secrets.MAL_CLIENT_SECRET }}
          CALLBACK_SCHEME: ${{ secrets.CALLBACK_SCHEME }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          COMMENTS_BASE_URL: ${{ secrets.COMMENTS_BASE_URL }}
        run: |
          cat > .env << EOF
          AL_CLIENT_ID=$AL_CLIENT_ID
          AL_CLIENT_SECRET=$AL_CLIENT_SECRET
          SIMKL_CLIENT_ID=$SIMKL_CLIENT_ID
          SIMKL_CLIENT_SECRET=$SIMKL_CLIENT_SECRET
          MAL_CLIENT_ID=$MAL_CLIENT_ID
          MAL_CLIENT_SECRET=$MAL_CLIENT_SECRET
          CALLBACK_SCHEME=${CALLBACK_SCHEME:-anymex://callback}
          TMDB_API_KEY=$TMDB_API_KEY
          COMMENTS_BASE_URL=${COMMENTS_BASE_URL:-http://anymex.duckdns.org:8000/functions/v1}
          APP_CHANNEL=$RELEASE_CHANNEL
          APP_VERSION_TAG=$TAG
          EOF
          # Stamp the version into the app and the installer.
          sed -i -E "s/^version: .*/version: $VERSION+$BUILD/" pubspec.yaml
          sed -i -E "s/^    version: [0-9.]+$/    version: $VERSION/" pubspec.yaml

      - name: Make the beta app (AnymeX+ β)
        if: env.RELEASE_CHANNEL == 'beta'
        shell: bash
        run: python scripts/beta_build.py windows

      - name: Build Windows app + installer
        shell: pwsh
        run: |
          flutter pub get
          dart run inno_bundle:build --release 2>&1 | Select-String -Pattern "Compile aborted" -NotMatch
          $issFile = "build\windows\x64\installer\Release\inno-script.iss"
          if (-not (Test-Path $issFile)) { Write-Error "ISS file not found: $issFile"; exit 1 }
          $content = Get-Content $issFile -Raw
          $content = $content -replace '.*Icelandic\.isl.*\r?\n', ''
          Set-Content $issFile -Value $content -NoNewline
          & iscc $issFile
          if ($LASTEXITCODE -ne 0) { Write-Error "Inno Setup failed ($LASTEXITCODE)"; exit 1 }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Get-ChildItem build\windows\x64\installer\Release\*.exe | Select-Object -First 1 | Copy-Item -Destination "dist\AnymeX-Stremio-v$env:FILE_VER-Windows-Setup.exe"
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath "dist\AnymeX-Stremio-v$env:FILE_VER-Windows-Portable.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  # One release per update, with everything in it. Publishes even if only
  # the iOS build succeeded (the Windows files are then missing).
  release:
    needs: [analyze, ios, windows]
    if: ${{ !cancelled() && needs.ios.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.analyze.outputs.version }}
      BUILD: ${{ needs.analyze.outputs.build }}
      RELEASE_CHANNEL: ${{ needs.analyze.outputs.channel }}
      TAG: ${{ needs.analyze.outputs.tag }}
      FILE_VER: ${{ needs.analyze.outputs.file_ver }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Stable notes cover everything since the last stable release (all
      # the betas that went into it); beta notes cover the last build.
      - name: Release notes
        run: |
          if [ "$RELEASE_CHANNEL" = beta ]; then
            PREV=$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD^ 2>/dev/null || true)
          else
            PREV=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-beta' HEAD^ 2>/dev/null || true)
          fi
          {
            if [ "$RELEASE_CHANNEL" = beta ]; then
              echo "> **Beta build.** Installs next to AnymeX+ as a separate app, **AnymeX+ β**, with its own sign-ins and library. It may have bugs; once it's ready it ships as **v$VERSION**."
              echo
            fi
            echo "## What's new"
            if [ -n "$PREV" ]; then
              git log "$PREV"..HEAD --no-merges --format='- %s' | grep -v '^- Merge' | sed 's/ \[skip ci\]//' || true
            else
              git log -n 15 --no-merges --format='- %s' | sed 's/ \[skip ci\]//'
            fi
            echo
            echo "## Install"
            if [ "$RELEASE_CHANNEL" = beta ]; then
              echo "- **iPhone (Feather):** add the beta source \`https://raw.githubusercontent.com/$REPO/feather/source-beta.json\` and install **AnymeX+ β**, or download the \`.ipa\` below."
              echo "- **Windows:** run the \`Setup.exe\` (installs **AnymeXStremio Beta** next to the normal app), or unzip the \`Portable.zip\` and open \`anymex.exe\`. If SmartScreen warns, choose **More info → Run anyway**."
            else
              echo "- **iPhone (Feather):** add the source \`https://github.com/$REPO/releases/latest/download/source.json\` and update **AnymeX+**, or download the \`.ipa\` below."
              echo "- **Windows:** run the \`Setup.exe\`, or unzip the \`Portable.zip\` and open \`anymex.exe\`. If SmartScreen warns, choose **More info → Run anyway**."
            fi
            echo
            echo "Built from ${GITHUB_SHA:0:7} (build $BUILD)."
          } > notes.md
          cat notes.md

      - name: Feather / AltStore source
        if: env.RELEASE_CHANNEL == 'stable'
        run: |
          python3 - <<'PY'
          import json, os, subprocess, datetime
          repo, version, build = os.environ["REPO"], os.environ["VERSION"], os.environ["BUILD"]
          owner = repo.split("/")[0]
          ipa_name = f"AnymeX-Stremio-v{version}.ipa"
          size = os.path.getsize(f"dist/{ipa_name}")
          now = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          notes = open("notes.md").read().split("## Install")[0].replace("## What's new", "").strip()
          versions = [{
              "version": version, "buildVersion": build, "date": now,
              "localizedDescription": notes or f"Version {version}",
              "downloadURL": f"https://github.com/{repo}/releases/download/v{version}/{ipa_name}",
              "size": size, "minOSVersion": "13.0",
          }]
          # Older versions, so Feather can show the history / downgrade.
          try:
              out = subprocess.run(["gh", "api", f"repos/{repo}/releases?per_page=100"],
                                   capture_output=True, text=True, check=True).stdout
              for rel in json.loads(out):
                  tag = rel.get("tag_name", "")
                  if not tag.startswith("v") or tag == f"v{version}" or rel.get("draft"):
                      continue
                  try:
                      older = tuple(int(x) for x in tag[1:].split(".")) < tuple(int(x) for x in version.split("."))
                  except ValueError:
                      older = False
                  if not older:
                      continue
                  ipa = next((a for a in rel.get("assets", []) if a["name"].endswith(".ipa")), None)
                  if not ipa:
                      continue
                  versions.append({
                      "version": tag[1:], "date": rel.get("published_at") or now,
                      "localizedDescription": (rel.get("body") or "").split("## Install")[0].replace("## What's new", "").strip()[:1500],
                      "downloadURL": ipa["browser_download_url"], "size": ipa["size"],
                      "minOSVersion": "13.0",
                  })
          except Exception as e:
              print("Could not list older releases:", e)
          icon = f"https://raw.githubusercontent.com/{repo}/main/logo.png"
          desc = ("AnymeX (anime & manga tracker/player) with Stremio built in: "
                  "Stremio login and addons, a Movies & TV tab, and watch "
                  "progress synced to Stremio. AniList, MAL, Simkl and Discord "
                  "status included.")
          source = {
            "name": "AnymeX+ (Stremio)",
            "identifier": "com.mikeyislost.anymexstremio.source",
            "subtitle": "Personal AnymeX + Stremio build",
            "description": desc, "iconURL": icon,
            "website": f"https://github.com/{repo}", "tintColor": "#7C4DFF",
            "apps": [{
              "name": "AnymeX+", "bundleIdentifier": "com.mikeyislost.anymexstremio",
              "developerName": owner, "subtitle": "AnymeX with Stremio built in",
              "localizedDescription": desc, "iconURL": icon, "tintColor": "#7C4DFF",
              "category": "entertainment",
              "version": version, "versionDate": now,
              "versionDescription": versions[0]["localizedDescription"],
              "downloadURL": versions[0]["downloadURL"], "size": size,
              "screenshotURLs": [], "appPermissions": {},
              "versions": versions,
            }],
            "news": [],
          }
          json.dump(source, open("dist/source.json", "w"), indent=2)
          print(json.dumps(source, indent=2)[:3000])
          PY

      - name: Publish release v${{ env.VERSION }}
        if: env.RELEASE_CHANNEL == 'stable'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: AnymeX+ v${{ env.VERSION }}
          body_path: notes.md
          make_latest: true
          files: dist/*

      - name: Publish beta v${{ env.TAG }}
        if: env.RELEASE_CHANNEL == 'beta'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: AnymeX+ β v${{ env.TAG }}
          body_path: notes.md
          prerelease: true
          make_latest: false
          files: dist/*

      # Betas can't use the "latest release" link (it skips pre-releases),
      # so their Feather source lives on the `feather` branch.
      - name: Beta Feather source
        if: env.RELEASE_CHANNEL == 'beta'
        run: |
          gh release view "v$TAG" -R "$REPO" --json assets,body > beta_release.json
          python3 - <<'PY'
          import json, os, datetime
          repo, version, build, tag = (os.environ[k] for k in ("REPO", "VERSION", "BUILD", "TAG"))
          rel = json.load(open("beta_release.json"))
          ipa = next(a for a in rel["assets"] if a["name"].endswith(".ipa"))
          now = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          notes = open("notes.md").read().split("## What's new")[-1].split("## Install")[0].strip()
          notes = f"Beta v{tag}\n\n{notes}"
          icon = f"https://raw.githubusercontent.com/{repo}/feather/beta-logo.png"
          desc = ("Beta builds of AnymeX+ (AnymeX with Stremio built in). Installs "
                  "next to the normal app as AnymeX+ \u03b2, with its own sign-ins "
                  "and library. New fixes land here first.")
          app = {
            "name": "AnymeX+ \u03b2", "bundleIdentifier": "com.mikeyislost.anymexstremio.beta",
            "developerName": repo.split("/")[0], "subtitle": "AnymeX+ beta builds",
            "localizedDescription": desc, "iconURL": icon, "tintColor": "#FF6B35",
            "category": "entertainment", "beta": True,
            "version": version, "buildVersion": build, "versionDate": now,
            "versionDescription": notes, "downloadURL": ipa["url"], "size": ipa["size"],
            "screenshotURLs": [], "appPermissions": {},
            "versions": [{
              "version": version, "buildVersion": build, "date": now,
              "localizedDescription": notes, "downloadURL": ipa["url"],
              "size": ipa["size"], "minOSVersion": "13.0",
            }],
          }
          source = {
            "name": "AnymeX+ \u03b2 (Beta)", "identifier": "com.mikeyislost.anymexstremio.beta.source",
            "subtitle": "AnymeX+ beta builds", "description": desc, "iconURL": icon,
            "website": f"https://github.com/{repo}", "tintColor": "#FF6B35",
            "apps": [app], "news": [],
          }
          json.dump(source, open("source-beta.json", "w"), indent=2)
          print(json.dumps(source, indent=2))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin feather >/dev/null 2>&1; then
            git fetch -q origin feather
            git worktree add -q -B feather /tmp/feather FETCH_HEAD
          else
            git worktree add -q --detach /tmp/feather
            (cd /tmp/feather && git checkout -q --orphan feather && git rm -rqf .)
          fi
          cp source-beta.json /tmp/feather/source-beta.json
          cp beta/logo.png /tmp/feather/beta-logo.png
          printf '# Feather source for AnymeX+ betas\n\nUpdated automatically by every beta build. Add this source in Feather:\n\nhttps://raw.githubusercontent.com/%s/feather/source-beta.json\n' "$REPO" > /tmp/feather/README.md
          cd /tmp/feather
          git add -A
          git commit -qm "Beta source: v$TAG [skip ci]" || { echo "Source unchanged"; exit 0; }
          git push -q origin HEAD:feather

      # Keep the original Feather source URL (latest-ios/source.json)
      # working, and retire the old rolling download releases.
      - name: Update legacy source URL
        if: env.RELEASE_CHANNEL == 'stable'
        run: |
          gh release view latest-ios -R "$REPO" >/dev/null 2>&1 || exit 0
          for a in $(gh release view latest-ios -R "$REPO" --json assets -q '.assets[].name'); do
            [ "$a" = "source.json" ] || gh release delete-asset latest-ios "$a" -R "$REPO" -y || true
          done
          gh release upload latest-ios dist/source.json -R "$REPO" --clobber
          gh release edit latest-ios -R "$REPO" \
            --title "Feather source (legacy link)" \
            --notes "Only hosts source.json for the original Feather source URL. Get builds from the versioned releases." || true
          gh release delete latest-windows -R "$REPO" --cleanup-tag -y || true
          # Versions restarted at v1.0.x: remove the old v3.x releases.
          for t in $(gh release list -R "$REPO" --limit 100 --json tagName -q '.[].tagName' | grep -E '^v3\.' || true); do
            gh release delete "$t" -R "$REPO" --cleanup-tag -y || true
          done
